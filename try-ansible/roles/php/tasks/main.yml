---
- name: Add PHP repository
  ansible.builtin.apt_repository:
    repo: ppa:ondrej/php
    state: present
    update_cache: true

- name: Install PHP and required extensions for version {{ php_version }}
  ansible.builtin.apt:
    name: "{{ ['php' + php_version] + php_extensions }}"
    state: present

- name: Deploy PHP-FPM pool configuration
  ansible.builtin.template:
    src: www.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Ensure PHP-FPM is running and enabled
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
