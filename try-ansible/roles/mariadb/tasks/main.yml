---
- name: Download MariaDB signing key
  get_url:
    url: https://mariadb.org/mariadb_release_signing_key.asc
    dest: /usr/share/keyrings/mariadb-archive-keyring.asc
    mode: "0644"

- name: Add MariaDB {{ mariadb_version }} APT repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/mariadb-archive-keyring.asc] {{ mariadb_mirror }}/repo/{{ mariadb_version }}/ubuntu {{ ansible_distribution_release }} main"
    state: present
    update_cache: yes

- name: Install MariaDB server
  apt:
    name: mariadb-server
    state: present

- name: Ensure MariaDB is running and enabled at boot
  systemd:
    name: mariadb
    state: started
    enabled: true

- name: Install python3-mysqldb for Ansible mysql modules
  apt:
    name: python3-mysqldb
    state: present

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent

- name: Remove MySQL test database
  community.mysql.mysql_db:
    name: test
    state: absent

- name: Restrict root to localhost only
  community.mysql.mysql_query:
    query: "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost')"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  changed_when: false
  notify: flush mysql privileges

- name: Create Shopware database
  community.mysql.mysql_db:
    name: "{{ shopware_db_name }}"
    state: present

- name: Create Shopware database user
  community.mysql.mysql_user:
    name: "{{ shopware_db_user }}"
    password: "{{ shopware_db_password }}"
    priv: "{{ shopware_db_name }}.*:ALL"
    state: present
