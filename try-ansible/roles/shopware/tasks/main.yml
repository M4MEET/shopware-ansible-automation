---
- name: Download Composer installer
  ansible.builtin.get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-installer.php
    mode: "0644"

- name: Get expected Composer installer hash
  ansible.builtin.uri:
    url: https://composer.github.io/installer.sig
    return_content: true
  register: composer_expected_hash

- name: Verify Composer installer hash
  ansible.builtin.command: >-
    php -r "if (hash_file('sha384', '/tmp/composer-installer.php')
    === '{{ composer_expected_hash.content | trim }}')
    { echo 'Verified'; } else { echo 'HASH MISMATCH'; exit(1); }"
  changed_when: false

- name: Install Composer globally
  ansible.builtin.command: php /tmp/composer-installer.php --install-dir=/usr/local/bin --filename=composer
  args:
    creates: /usr/local/bin/composer

- name: Create web root directory for Shopware
  ansible.builtin.file:
    path: "{{ shopware_root }}"
    state: directory
    owner: "{{ shopware_web_user }}"
    group: "{{ shopware_web_group }}"
    mode: "0755"

- name: Install Shopware via Composer version {{ shopware_version }}
  ansible.builtin.command: >
    composer create-project
    shopware/production:{{ shopware_version }}
    {{ shopware_root }}
    --no-interaction
  become: true
  become_user: "{{ shopware_web_user }}"
  args:
    creates: "{{ shopware_root }}/composer.json"
  environment:
    COMPOSER_HOME: /tmp/composer

- name: Set permissions on Shopware directory
  ansible.builtin.file:
    path: "{{ shopware_root }}"
    state: directory
    owner: "{{ shopware_web_user }}"
    group: "{{ shopware_web_group }}"
    recurse: true

- name: Generate Shopware .env file
  ansible.builtin.template:
    src: shopware.env.j2
    dest: "{{ shopware_root }}/.env"
    owner: "{{ shopware_web_user }}"
    group: "{{ shopware_web_group }}"
    mode: "0640"

- name: Run Shopware system install
  ansible.builtin.command: >
    php {{ shopware_root }}/bin/console system:install
    --basic-setup
    --force
  become: true
  become_user: "{{ shopware_web_user }}"
  args:
    creates: "{{ shopware_root }}/install.lock"
  environment:
    APP_ENV: "{{ shopware_app_env }}"
    DATABASE_URL: "mysql://{{ shopware_db_user }}:{{ shopware_db_password }}@127.0.0.1:3306/{{ shopware_db_name }}"

- name: Warmup Shopware cache
  ansible.builtin.command: "php {{ shopware_root }}/bin/console cache:warmup"
  become: true
  become_user: "{{ shopware_web_user }}"
  changed_when: false
  environment:
    APP_ENV: "{{ shopware_app_env }}"
