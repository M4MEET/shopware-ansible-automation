---
- name: Install MariaDB
  ansible.builtin.include_tasks: mariadb.yml
  when: db_engine == "mariadb"

- name: Install MySQL
  ansible.builtin.include_tasks: mysql.yml
  when: db_engine == "mysql"

- name: Install python3-mysqldb for Ansible mysql modules
  ansible.builtin.apt:
    name: python3-mysqldb
    state: present

- name: Remove anonymous database users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent

- name: Remove test database
  community.mysql.mysql_db:
    name: test
    state: absent

- name: Restrict root to localhost only
  community.mysql.mysql_query:
    query: "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost')"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  changed_when: false
  notify: Flush mysql privileges

- name: Create Shopware database
  community.mysql.mysql_db:
    name: "{{ shopware_db_name }}"
    state: present

- name: Create Shopware database user
  community.mysql.mysql_user:
    name: "{{ shopware_db_user }}"
    password: "{{ shopware_db_password }}"
    priv: "{{ shopware_db_name }}.*:ALL"
    state: present
