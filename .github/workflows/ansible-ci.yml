---
name: Ansible CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ansible-core ansible-lint

      - name: Install Ansible Galaxy collections
        run: ansible-galaxy collection install -r try-ansible/requirements.yml

      - name: Run ansible-lint
        run: ansible-lint try-ansible/playbook.yml

      - name: Syntax check
        run: ansible-playbook try-ansible/playbook.yml --syntax-check
